<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — HalalNeo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background: oklch(0.978 0.01 88);
      color: oklch(0.22 0.02 205);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 420px;
      padding: 3rem 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 4px 24px oklch(0 0 0 / 0.08);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; opacity: 0.7; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      background: oklch(0.48 0.18 150);
      color: white;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      No network connection detected. Some cached pages may still be available.
      When you're back online, the site will work normally.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
