<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="oklch(0.978 0.01 88)" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="oklch(0.15 0.028 205)" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="HalalNeo" />
		<link rel="apple-touch-icon" href="/icons/icon-192.svg" />
		<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
		<link rel="preconnect" href="https://www.google-analytics.com" crossorigin />
		<link
			rel="preload"
			href="/fonts/space-grotesk/space-grotesk-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/space-grotesk/space-grotesk-latin-ext.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/almarai/almarai-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/almarai/almarai-700.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Google tag (gtag.js) — deferred; skipped when Save-Data is on -->
		<script>
			if (!navigator.connection?.saveData && !navigator.sendBeacon) {
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://www.googletagmanager.com/gtag/js?id=G-7XP063VED4';
				document.head.appendChild(s);
			}
		</script>
		<script>
			if (!navigator.connection?.saveData) {
				window.dataLayer = window.dataLayer || [];
				function gtag() { dataLayer.push(arguments); }
				gtag('js', new Date());
				gtag('config', 'G-7XP063VED4');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js').then(function(reg) {
					// Check for SW updates every 60 minutes
					setInterval(function() { reg.update(); }, 3600000);
				}).catch(function() {});
			}
		</script>
	</body>
</html>
