<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="theme-color"
			content="oklch(0.968 0.013 88)"
			media="(prefers-color-scheme: light)"
		/>
		<meta name="theme-color" content="oklch(0.16 0.022 205)" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="HalalNeo" />
		<link rel="apple-touch-icon" href="/icons/icon-192.svg" />
		<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
		<link rel="preconnect" href="https://www.google-analytics.com" crossorigin />
		<link
			rel="preload"
			href="/fonts/space-grotesk/space-grotesk-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/space-grotesk/space-grotesk-latin-ext.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/almarai/almarai-400.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/almarai/almarai-700.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Google tag (gtag.js) — stub first so commands queue on dataLayer
			 even before the library loads; skipped entirely when Save-Data is on.
			 `send_page_view: false` because SvelteKit navigates client-side:
			 each route change is reported manually (see root layout). -->
		<script>
			window.dataLayer = window.dataLayer || [];
			window.gtag = function gtag() {
				window.dataLayer.push(arguments);
			};
			(function () {
				var conn = navigator.connection;
				if (conn && conn.saveData) return;
				window.gtag('js', new Date());
				window.gtag('config', 'G-7XP063VED4', { send_page_view: false });
				// Keep the ~170kB library off the critical path: dataLayer (plus the
				// stub above) buffers every command — including manual page_view
				// pushes — until the real gtag arrives, so delaying loses nothing.
				var load = function () {
					var s = document.createElement('script');
					s.async = true;
					s.src = 'https://www.googletagmanager.com/gtag/js?id=G-7XP063VED4';
					document.head.appendChild(s);
				};
				if ('requestIdleCallback' in window) {
					requestIdleCallback(load, { timeout: 4000 });
				} else {
					setTimeout(load, 2000);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker
					.register('/sw.js')
					.then(function (reg) {
						// Check for SW updates every 60 minutes
						setInterval(function () {
							reg.update();
						}, 3600000);
					})
					.catch(function () {});
			}
		</script>
	</body>
</html>
